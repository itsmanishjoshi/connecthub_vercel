services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: connecthub
      POSTGRES_USER: connecthub_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_office_db}
    volumes:
      - connecthub_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U connecthub_user -d connecthub"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${OFFICE_PORT:-8080}:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://connecthub_user:${POSTGRES_PASSWORD:-changeme_office_db}@db:5432/connecthub}
      AUTH_SECRET: ${AUTH_SECRET:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme_admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@connecthub.local}
      AI_PROVIDER: ${AI_PROVIDER:-groq}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      GROK_API_KEY: ${GROK_API_KEY:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      SERVE_STATIC: "1"
      OFFICE_PORT: "8080"
      UPLOAD_DIR: /data/uploads
    volumes:
      - connecthub_uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

volumes:
  connecthub_pg:
  connecthub_uploads:
